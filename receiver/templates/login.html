<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eaf2ff, #f8fbff);
            min-height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            margin: 120px auto;
            background: white;
            padding: 36px 30px;
            border-radius: 18px;
            box-shadow: 0 14px 40px rgba(15, 23, 42, 0.12);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #111827;
            font-size: 28px;
        }

        .login-container input {
            width: 100%;
            padding: 14px 15px;
            margin-bottom: 18px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .login-container input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .login-container button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #2563eb, #1d4ed8);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.25s;
        }

        .login-container button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.25);
        }

        .error-text {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 14px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .login-container {
                max-width: 92%;
                margin: 80px auto;
                padding: 28px 20px;
            }

            .login-container h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Medical Image Login</h2>

        {% if error %}
            <p class="error-text">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <input type="text" name="username" placeholder="Enter username" required>
            <input type="password" name="password" placeholder="Enter password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
